<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Pedido Test</title>

  <style>

    body {
      font-family: Arial;
      padding: 40px;
      max-width: 500px;
      margin: auto;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 16px;
    }

    button {
      cursor: pointer;
    }

  </style>
</head>
<body>

  <h1>Nuevo Pedido</h1>

  <input type="text" id="cliente" placeholder="Nombre cliente">

  <select id="producto">
    <option>Bowl Cookies</option>
    <option>Bowl Brookies</option>
  </select>

  <input type="number" id="cantidad" placeholder="Cantidad bowls">

  <input type="number" id="chips" placeholder="Mini Choco Chips">

  <button onclick="enviarPedido()">
    Enviar Pedido
  </button>

  <script>

    async function enviarPedido() {

      const datos = {

        cliente:
          document.getElementById("cliente").value,

        producto:
          document.getElementById("producto").value,

        cantidad:
          document.getElementById("cantidad").value,

        chips:
          document.getElementById("chips").value

      };

      await fetch("https://script.google.com/macros/s/AKfycbzW55ymf9wbc881RWlg1t33VmcdroTzWrU4xu5SzaUClR-VBu-iWxGGELttsGQah1CB/exec", {

        method: "POST",

        body: JSON.stringify(datos)

      });

      alert("Pedido enviado");

    }

  </script>

</body>
</html>
